name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone
        run: npm run build

      - name: Prepare deployment package
        run: |
          rm -rf deploy_package deploy.tar.gz
          mkdir -p deploy_package/.next

          cp -r .next/standalone/* deploy_package/

          # keep standalone runtime deps, but don't deploy them as a real node_modules folder
          if [ -d "deploy_package/node_modules" ]; then
            mv deploy_package/node_modules deploy_package/standalone_node_modules
          fi

          cp -r .next/static deploy_package/.next/

          if [ -d "./public" ]; then
            cp -r public deploy_package/
          fi

          tar -czf deploy.tar.gz -C deploy_package .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.CPANEL_PORT }} ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists
        run: |
          ssh -p ${{ secrets.CPANEL_PORT }} ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} "
            mkdir -p '${{ secrets.DEPLOY_PATH }}'
          "

      - name: Upload deployment package
        run: |
          scp -P ${{ secrets.CPANEL_PORT }} deploy.tar.gz \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.DEPLOY_PATH }}/deploy.tar.gz

            - name: Extract deployment package on server
        run: |
          ssh -p ${{ secrets.CPANEL_PORT }} ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} "
            cd '${{ secrets.DEPLOY_PATH }}' &&
            find . -mindepth 1 -maxdepth 1 \
              ! -name deploy.tar.gz \
              ! -name node_modules \
              ! -name .htaccess \
              ! -name tmp \
              -exec rm -rf {} \; &&
            tar -xzf deploy.tar.gz &&
            rm -f deploy.tar.gz &&

            if [ -d standalone_node_modules ]; then
              mkdir -p node_modules &&
              cp -a standalone_node_modules/. node_modules/ &&
              rm -rf standalone_node_modules
            fi

            echo 'Root files:' &&
            ls -la
          "